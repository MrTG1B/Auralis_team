<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Auralis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* Define theme colors and fonts */
        :root {
            --bg-color: #121313;
            --grid-color: rgba(202, 76, 73, 0.07);
            --text-primary: #f0f0f0;
            --text-secondary: #a7a7a7;
            --accent-red: #CA4C49;
            --accent-amber: #f39c12;
        }

        /* Base styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        /* Animated grid background */
        .grid-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: pan-grid 60s linear infinite;
            z-index: 0;
        }

        /* Main content styling */
        .content-wrapper {
            position: relative;
            z-index: 1;
            animation: fadeIn 1s ease-out;
        }

        /* 404 Text with Glitch Animation */
        .glitch-text {
            font-size: clamp(5rem, 20vw, 12rem); /* Reduced size */
            font-weight: 900;
            line-height: 1;
            color: #2a2a2a;
            position: relative;
            animation: glitch-skew 1s infinite linear alternate-reverse;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            overflow: hidden;
        }

        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 var(--accent-red);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-1 4s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: -2px 0 var(--accent-amber), 2px 2px var(--accent-red);
            clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        /* Flickering Streetlight Animation */
        .flickering-light {
            animation: flicker 4s infinite linear;
        }
        
        /* Button Styling */
        .home-button {
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(202, 76, 73, 0.2);
        }

        .home-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(202, 76, 73, 0.5);
        }

        /* Keyframe Animations */
        @keyframes pan-grid {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            5% { transform: skew(1deg); }
            10% { transform: skew(-1deg); }
            15% { transform: skew(0deg); }
            100% { transform: skew(0deg); }
        }
        
        @keyframes glitch-anim-1 {
            0% { clip-path: polygon(0 2%, 100% 2%, 100% 33%, 0 33%); }
            5% { clip-path: polygon(0 78%, 100% 78%, 100% 100%, 0 100%); }
            10% { clip-path: polygon(0 50%, 100% 50%, 100% 51%, 0 51%); }
            15% { clip-path: polygon(0 0, 100% 0, 100% 1%, 0 1%); }
            20% { clip-path: polygon(0 60%, 100% 60%, 100% 70%, 0 70%); }
            25% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); }
            30% { clip-path: polygon(0 99%, 100% 99%, 100% 100%, 0 100%); }
            35% { clip-path: polygon(0 40%, 100% 40%, 100% 42%, 0 42%); }
            40% { clip-path: polygon(0 25%, 100% 25%, 100% 26%, 0 26%); }
            45% { clip-path: polygon(0 80%, 100% 80%, 100% 85%, 0 85%); }
            50% { clip-path: polygon(0 55%, 100% 55%, 100% 58%, 0 58%); }
            55% { clip-path: polygon(0 5%, 100% 5%, 100% 6%, 0 6%); }
            60% { clip-path: polygon(0 90%, 100% 90%, 100% 95%, 0 95%); }
            65% { clip-path: polygon(0 30%, 100% 30%, 100% 31%, 0 31%); }
            70% { clip-path: polygon(0 70%, 100% 70%, 100% 72%, 0 72%); }
            75% { clip-path: polygon(0 15%, 100% 15%, 100% 19%, 0 19%); }
            80% { clip-path: polygon(0 45%, 100% 45%, 100% 48%, 0 48%); }
            85% { clip-path: polygon(0 98%, 100% 98%, 100% 100%, 0 100%); }
            90% { clip-path: polygon(0 22%, 100% 22%, 100% 28%, 0 28%); }
            95% { clip-path: polygon(0 68%, 100% 68%, 100% 73%, 0 73%); }
            100% { clip-path: polygon(0 42%, 100% 42%, 100% 43%, 0 43%); }
        }

        @keyframes glitch-anim-2 {
             0% { clip-path: polygon(0 67%, 100% 67%, 100% 79%, 0 79%); }
            5% { clip-path: polygon(0 12%, 100% 12%, 100% 20%, 0 20%); }
            10% { clip-path: polygon(0 99%, 100% 99%, 100% 100%, 0 100%); }
            15% { clip-path: polygon(0 33%, 100% 33%, 100% 34%, 0 34%); }
            20% { clip-path: polygon(0 82%, 100% 82%, 100% 89%, 0 89%); }
            25% { clip-path: polygon(0 43%, 100% 43%, 100% 55%, 0 55%); }
            30% { clip-path: polygon(0 4%, 100% 4%, 100% 10%, 0 10%); }
            35% { clip-path: polygon(0 75%, 100% 75%, 100% 77%, 0 77%); }
            40% { clip-path: polygon(0 55%, 100% 55%, 100% 56%, 0 56%); }
            45% { clip-path: polygon(0 20%, 100% 20%, 100% 25%, 0 25%); }
            50% { clip-path: polygon(0 91%, 100% 91%, 100% 98%, 0 98%); }
            55% { clip-path: polygon(0 63%, 100% 63%, 100% 64%, 0 64%); }
            60% { clip-path: polygon(0 26%, 100% 26%, 100% 35%, 0 35%); }
            65% { clip-path: polygon(0 77%, 100% 77%, 100% 78%, 0 78%); }
            70% { clip-path: polygon(0 50%, 100% 50%, 100% 52%, 0 52%); }
            75% { clip-path: polygon(0 39%, 100% 39%, 100% 45%, 0 45%); }
            80% { clip-path: polygon(0 88%, 100% 88%, 100% 92%, 0 92%); }
            85% { clip-path: polygon(0 1%, 100% 1%, 100% 2%, 0 2%); }
            90% { clip-path: polygon(0 58%, 100% 58%, 100% 68%, 0 68%); }
            95% { clip-path: polygon(0 7%, 100% 7%, 100% 13%, 0 13%); }
            100% { clip-path: polygon(0 83%, 100% 83%, 100% 84%, 0 84%); }
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.2; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="grid-background"></div>

    <main class="content-wrapper text-center p-8 flex flex-col items-center">
        <!-- Thematic SVG Illustration -->
        <div class="relative w-40 h-40 mb-4"> <!-- Reduced Size -->
            <!-- Flickering light cone -->
            <svg class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-full flickering-light" viewBox="0 0 100 100" preserveAspectRatio="none">
                <defs>
                    <radialGradient id="lightGradient" cx="50%" cy="0%" r="75%" fx="50%" fy="0%">
                        <stop offset="0%" style="stop-color:rgba(243, 156, 18, 0.5)" />
                        <stop offset="100%" style="stop-color:rgba(243, 156, 18, 0)" />
                    </radialGradient>
                </defs>
                <polygon points="20,0 80,0 100,100 0,100" fill="url(#lightGradient)" />
            </svg>
            <!-- Streetlight SVG -->
            <svg class="relative z-10 w-full h-full" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20h6m-3-14v14m-3-14h6m-3-3v3m-5.657 5.657L6.343 9.657m11.314 0L17.657 8.343" stroke="#a7a7a7"></path>
                <!-- Broken "X" mark -->
                 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8 L20 12 M20 8 L16 12" stroke="#CA4C49"></path>
            </svg>
        </div>

        <h1 class="glitch-text">404</h1>
        
        <h2 class="text-3xl md:text-4xl font-bold text-text-primary mt-2 tracking-wider uppercase"> <!-- Reduced Margin -->
            Lost Signal
        </h2>
        
        <p class="text-lg text-text-secondary mt-4 max-w-md">
            It seems you've taken a turn down an unlit road. The page you were looking for doesn't exist or is offline.
        </p>

        <a href="/dashboard" class="home-button mt-8 inline-block bg-accent-red text-white font-bold py-3 px-8 rounded-lg text-lg uppercase tracking-wider"> <!-- Reduced Margin -->
            Return to Dashboard
        </a>
    </main>

</body>
</html>
