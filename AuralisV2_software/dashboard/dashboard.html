<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuralisView</title>
    <link rel="stylesheet" href="/dashboard/dashboard_static/dashboard_style.css">
    <link rel="stylesheet" href="/dashboard/dashboard_static/powerSaving_styles.css">
    <link rel="icon" type="image/png" href="https://luma-dashboard.netlify.app/assets/images/logo.png">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Auralis">
    <meta property="og:description" content="Auralis - Your smart solution for street lighting.">
    <meta property="og:image" content="https://luma-dashboard.netlify.app/assets/images/logo.png">
    <meta property="og:url" content="https://auralis-dashboard.netlify.app/">
    <meta property="og:type" content="website">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- THE FIX: Include the Socket.IO client library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>

</head>
<body id="main-window-body">
    <!-- SVG Gradients for Gauges -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="gradientRed" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="gradientGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    

    <div id="left-panel">
        <div id="streetNameContainer">
            <header id="streetNameSearch">
                <input type="text" id="streetNameInput" placeholder="Search Street Name">
            </header>
            <div id="streetNameList" class="listContainer">
                <!-- Street list will be populated by script -->
            </div>
        </div>

        <div id="profile">
            <div id="profilePicture">
                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile Picture">
            </div>
            <p id="profileName">Tirtha</p>
        </div>
    </div>

    <div id="middle-panel">
        <header id="main-header">
            <h1 id="header-title">AuralisView</h1>
            <div id="powerSaveButtonContainer">
                <button class="power-save-btn" id="openPowerSaveModalBtn" type="button">
                    <svg class="power-save-bg-loader" preserveAspectRatio="none">
                        <defs>
                            <linearGradient id="powerSavingGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#e74c3c;" />
                                <stop offset="50%" style="stop-color:#f39c12;" />
                                <stop offset="100%" style="stop-color:#2ecc71;" />
                            </linearGradient>
                        </defs>
                        <rect id="power-saving-bar" x="0" y="0" width="0%" height="100%" fill="url(#powerSavingGradient)" />
                    </svg>
                    <div class="power-save-content">
                        <span class="power-save-label">Power Saving Active</span>
                        <span class="power-save-value" id="power-save-percentage">0%</span>
                    </div>
                </button>
            </div>
            <div id="header-datetime">
                <p id="timeText">--:--:--</p>
                <p id="dateText">---,--- --</p>
            </div>
        </header>
        
        <div id="mapContainer" class="middle-panel-cards">
            <div id="map"></div>
        </div>

        <div id="totalEnergyConsumptionConatiner" class="gauge-card middle-panel-cards">
            <div class="gauge-container">
                <svg class="gauge-svg" viewBox="0 0 100 100">
                    <circle class="gauge-track" cx="50" cy="50" r="42"></circle>
                    <circle id="consumptionValueBar" class="gauge-value-bar" cx="50" cy="50" r="42"></circle>
                </svg>
                <div class="gauge-text-content">
                    <span class="gauge-value">--</span>
                    <span class="gauge-label">Energy Consumed</span>
                </div>
            </div>
        </div>
        
        <div id="totalEnergySavedContainer" class="gauge-card middle-panel-cards">
            <div class="gauge-container">
                <svg class="gauge-svg" viewBox="0 0 100 100">
                    <circle class="gauge-track" cx="50" cy="50" r="42"></circle>
                    <circle id="savedValueBar" class="gauge-value-bar" cx="50" cy="50" r="42"></circle>
                </svg>
                <div class="gauge-text-content">
                    <span class="gauge-value">--</span>
                    <span class="gauge-label">Energy Saved</span>
                </div>
            </div>
        </div>

        <div id="street-details-panel" class="middle-panel-cards">
             <h2 id="details-header">Details</h2>
            <div id="details-content">
                <p>Select a street or light post to view details.</p>
            </div>
        </div>
    </div>

    <div id="right-panel">
        <div id="light-post-manager">
            <nav id="tabs-nav">
                <button class="tab-button active" data-target="all-lights-panel">All Lights</button>
                <button class="tab-button" data-target="faulty-lights-panel">Faulty</button>
            </nav>
            <div id="tabs-content">
                <div id="all-lights-panel" class="tab-panel active">
                    <header class="lightNameSearch">
                        <input type="text" id="lightNameInput" placeholder="Search Light Post Number">
                    </header>
                    <div id="lightNameList" class="listContainer">
                        <!-- All lights list will be populated by script -->
                    </div>
                </div>
                <div id="faulty-lights-panel" class="tab-panel">
                    <!-- === UPDATED FAULT SEARCH BUTTON === -->
                    <button id="faultySearchBtn" class="fault-scan-button">
                        <div class="button-content-wrapper">
                            <!-- <img src="/assets/images/fault_scan.svg" class="scan-icon" alt="Fault Scan Icon"> -->
                             <object type="image/svg+xml" data="/assets/images/old_svg.svg" class="scan-icon">
                                <!-- Fallback text -->
                                Fault Scan Icon
                            </object>
                            <span class="button-text">Initiate Fault Scan</span>
                        </div>
                         <div class="scanner-animation"></div>
                    </button>
                    <!-- =================================== -->
                    <header class="lightNameSearch">
                        <input type="text" id="faultyLightNameInput" placeholder="Search Faulty Light Post Number">
                    </header>
                    <div id="faultyLightNameList" class="listContainer">
                        <!-- Faulty lights list will be populated by script -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- The main window container, which also acts as the dark overlay -->
    <div id="powerControlWindow" class="power-control-window">
        
        <!-- The content container that will slide in -->
        <div id="powerControlContainer">
            <header id="powerControlHeader">
                <h1>Street Power Saving</h1>
                <button id="closePowerControlBtn" class="close-btn" aria-label="Close Window">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </header>

            <div id="powerControlContent">
                <!-- This container will hold the list of streets -->
                <div id="street-power-list" class="street-power-list">                   
                    <!-- Add more street items here dynamically -->

                </div>
            </div>
        </div>
    </div>
    <script src="/dashboard/dashboard_static/dashboard_script.js"></script>
    <script src="/dashboard/dashboard_static/power_saving_script.js"></script>
</body>
</html>
